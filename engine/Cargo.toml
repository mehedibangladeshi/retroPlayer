[workspace]
resolver = "3"
members = ["crates/player-core", "crates/engine-sidecar"]

[workspace.package]
edition = "2024"
version = "0.1.2"
publish = false

[workspace.dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "pcm", "mp3", "aac", "isomp4", "alac", "ogg", "vorbis"] }
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Smaller sidecar in release bundles. opt-level stays 3 for real-time headroom, and panic
# stays "unwind" because the sidecar recovers from panics with catch_unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
