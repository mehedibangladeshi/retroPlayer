# Packaging for test builds (unsigned). `pnpm package` at the repo root builds the release
# sidecar, stages it into build/sidecar/, then runs electron-builder for the host OS.
appId: dev.mehedibangladeshi.retroplayer
productName: Cassette Player Retro
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The Rust engine ships next to app.asar, outside the archive, so it can be spawned.
# main/sidecar.ts resolves it from process.resourcesPath when the app is packaged.
extraResources:
  - from: build/sidecar/
    to: .
    filter:
      - engine-sidecar*
  # Key sounds, decoded by the engine (main/sidecar.ts resolves them from resources/sounds).
  - from: ../assets/audio/
    to: sounds
    filter:
      - '*.mp3'
artifactName: Cassette-Player-Retro-${version}-${os}-${arch}.${ext}
# Smallest downloads (xz/lzma for AppImage, nsis and dmg); packaging is slower.
compression: maximum
linux:
  target: [AppImage, tar.gz]
  executableName: cassette-player-retro
  category: Audio
win:
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg, zip]
  category: public.app-category.music
  # No Apple certificate yet: ad-hoc sign so Apple Silicon will launch it. Hardened runtime
  # must be off with ad-hoc signing (see electron-builder's macOptions docs).
  identity: '-'
  hardenedRuntime: false
