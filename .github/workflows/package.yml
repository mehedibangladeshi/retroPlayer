# Builds unsigned test bundles for Linux, Windows and macOS (Apple Silicon + Intel).
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also attach the
# bundles to a draft GitHub release.
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor low so the AppImage runs on older distros.
          - { os: ubuntu-22.04, name: linux-x64, builder: --linux --x64 }
          - { os: windows-latest, name: windows-x64, builder: --win --x64 }
          - { os: macos-latest, name: mac-arm64, builder: --mac --arm64 }
          # Intel Mac build cross-compiled from the Apple Silicon runner.
          - { os: macos-latest, name: mac-x64, builder: --mac --x64, rust_target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.name }}
      - name: ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and stage the engine sidecar
        run: node scripts/stage-sidecar.mjs ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
      - run: pnpm --filter app build
      - name: Package
        run: pnpm --filter app exec electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RetroPlayer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.AppImage
            app/dist/*.tar.gz
            app/dist/*.exe
            app/dist/*.zip
            app/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: bundles/*
