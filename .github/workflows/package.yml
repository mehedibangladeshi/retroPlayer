# Builds unsigned test bundles for Linux, Windows and macOS (Apple Silicon + Intel).
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also attach the
# bundles to a draft GitHub release.
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Least privilege by default. Only the release job below gets write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # v0.1.2-beta -> 0.1.2: drop the leading v and any -suffix.
          tag_base="${GITHUB_REF_NAME#v}"
          tag_base="${tag_base%%-*}"
          app_version="$(node -p "require(\"./app/package.json\").version")"
          if [ "$tag_base" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $app_version. Use a tag like v$app_version or v$app_version-beta." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches app version $app_version."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: check
      - name: ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --manifest-path engine/Cargo.toml --workspace
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor low so the AppImage runs on older distros.
          - { os: ubuntu-22.04, name: linux-x64, builder: --linux --x64 }
          - { os: windows-latest, name: windows-x64, builder: --win --x64 }
          - { os: macos-latest, name: mac-arm64, builder: --mac --arm64 }
          # Intel Mac build cross-compiled from the Apple Silicon runner.
          - { os: macos-latest, name: mac-x64, builder: --mac --x64, rust_target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.name }}
      - name: ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and stage the engine sidecar
        run: node scripts/stage-sidecar.mjs ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
      - run: pnpm --filter app build
      - name: Package
        run: pnpm --filter app exec electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: Cassette-Player-Retro-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.AppImage
            app/dist/*.tar.gz
            app/dist/*.exe
            app/dist/*.zip
            app/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: bundles/*
